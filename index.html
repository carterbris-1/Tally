<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A GitHub Pages site is publicly reachable and cannot be made otherwise on a free
         account. It does not have to be *findable*: this keeps it out of search results,
         so reaching it means already knowing the URL. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tally" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>Tally</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
